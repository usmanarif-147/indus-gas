services:
  app:
    build:
      context: .
      target: development
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-indus_gas}:${POSTGRES_PASSWORD:-replace-with-a-long-random-password}@db:5432/${POSTGRES_DB:-indus_gas}
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: postgres:17-alpine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-indus_gas}:${POSTGRES_PASSWORD:-replace-with-a-long-random-password}@db:5432/${POSTGRES_DB:-indus_gas}
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["/bin/sh", "-ec", "for file in /migrations/*.sql; do psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -f \"$$file\"; done"]
    restart: "no"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-indus_gas}
      POSTGRES_USER: ${POSTGRES_USER:-indus_gas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-long-random-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  node_modules:
  postgres_data:
